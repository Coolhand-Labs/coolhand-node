name: CI

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Lint code
      run: npm run lint || echo "No lint script found"

    - name: Type check
      run: npm run typecheck || echo "No typecheck script found"

    - name: Build TypeScript
      run: npm run build

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Display coverage summary
      run: |
        echo "📊 Coverage Summary:"
        if [ -f coverage/coverage-summary.json ]; then
          node -e "
            const coverage = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;
            console.log('Lines:      ' + total.lines.pct + '%');
            console.log('Functions:  ' + total.functions.pct + '%');
            console.log('Branches:   ' + total.branches.pct + '%');
            console.log('Statements: ' + total.statements.pct + '%');
            console.log('');
            console.log('✅ All coverage thresholds enforced by Jest configuration');
          "
        else
          echo "Coverage summary not found, but Jest enforces thresholds"
        fi

    - name: Check package can be built
      run: npm pack --dry-run